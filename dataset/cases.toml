[case.truth]
file = "lib/Schedule.php"
function = "blockSameTimeBookingByUser"
line_start = 9364
line_end = 9400
entry_point = "REST POST /wp-json/booking-package/v1/request (permission_callback __return_true) -> wp_ajax_booking_package_for_public, mode=sendBooking; needs the public booking nonce"
data_flow = "booking form email field -> getUserValues()['emails'] -> sendBooking() -> blockSameTimeBookingByUser($emails) -> $email concatenated into a LIKE inside the $wpdb->prepare() template (2 queries) -> $wpdb->get_row(). Only reached when the calendar option blockSameTimeBookingByUser == 1"
notes = """
Two sinks: SQL string at line 9365 (endUnix not null) and 9394 (range query).
`emails` LIKE '%\\"" . $email . "\\"%' AND `accountKey` = %d AND ...
Fix 1.7.21 turns both into LIKE %s with the value as a prepare() argument.
Draft: not yet confirmed that getUserValues() does not already restrict the email (advisory mentions is_email).
"""
drafted_by = "claude"

