[case.truth]
file = "public/class-save-as-pdf-pdfcrowd-public.php"
function = "save_as_pdf_pdfcrowd"
line_start = 1721
line_end = 1722
entry_point = "shortcode [save_as_pdf_pdfcrowd] / block_save_as_pdf_pdfcrowd with a pdf_created_callback attribute (author with contributor access); the call runs in the wp_ajax_(nopriv_)save_as_pdf_pdfcrowd handler when the button is used"
data_flow = "shortcode attribute pdf_created_callback -> eval_shortcode() copies every non-button_ attr into $custom_options (line ~956, no capability check) -> encrypted into the button -> wp_ajax handler decrypts $_POST['options'], json_decode, wp_parse_args into $options -> $options['pdf_created_callback']($hook_data) called as a function name"
notes = """
Sink: `if($options['pdf_created_callback']($hook_data)) {` (line 1722): attacker-chosen function name, first argument is an array.
Root cause is the missing authorization in eval_shortcode() (~line 940-959); 4.6.2 adds after it
`if(isset($custom_options['pdf_created_callback']) && !current_user_can('manage_options')) unset(...)`.
Draft: label placed on the sink; the reviewer should decide whether eval_shortcode (same file) is the better anchor.
"""
drafted_by = "claude"

