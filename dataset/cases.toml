[case.truth]
file = "admin/class-wf-woocommerce-packing-list-admin.php"
function = "print_document_from_the_mail_link"
line_start = 1139
line_end = 1153
entry_point = "any front-end request to init (hook 'init' -> print_window, priority 11, includes/class-wf-woocommerce-packing-list.php:379) with the mail-link parameters post, email and (empty) access_key; reaches print_document_from_the_mail_link() when guest document access is enabled"
data_flow = "$_REQUEST['post'] (base64url order id) and $_REQUEST['email'] (base64url billing email) -> wf_decode() (reversible, not a secret) -> wc_get_order($decoded_order_id) -> `elseif ( $decoded_mail_id === $order->get_billing_email() )` accepted as proof of ownership -> invoice / packing document of that order is generated and returned"
notes = """
Authorization flaw (IDOR): line 1149 `} elseif ( $decoded_mail_id === ( $order->get_billing_email() ) ) {`
accepts the billing email as credential; the order id is a sequential, guessable number.
Fix 5.0.3: handler needs a valid nonce or an access_key (print_window ~line 989) and the email branch is removed.
Draft: not traced - which document types are reachable after the check, and whether guest access is on by default.
"""
drafted_by = "claude"
reviewed_by = "BardLaudian"
reviewed_on = "2026-11-01"

