[case.truth]
file = "includes/class-ws-form-common.php"
function = "maybe_unserialize"
line_start = 7141
line_end = 7159
entry_point = "public form submission (WS Form submit endpoint) stores user-supplied values as submit meta; the stored value is later read back by admin/API code paths"
data_flow = "submitted value stored in submit meta (meta_value) -> read back -> WS_Form_Common::maybe_unserialize() / raw unserialize() with no allowed_classes -> attacker-chosen object instantiated (no POP chain in the plugin itself)"
notes = """
Central sink: `$unserialized_string = @unserialize($serialized_string);` (line 7154, retry on 7158).
Fix 1.10.82 adds allowed_classes = array('stdClass') there and replaces raw unserialize() elsewhere.
Other vulnerable raw unserialize() sites: includes/core/class-ws-form-submit-meta.php:200 (db_delete_file),
includes/core/class-ws-form-submit.php:3220 and :3544, api/class-ws-form-api-submit.php:219.
Draft: reviewer must decide the primary label (central sink vs. submit-meta.php:200) and whether the others count as extra locations.
"""
drafted_by = "claude"

