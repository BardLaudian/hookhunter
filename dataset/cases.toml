# One [[case]] per CVE in one plugin. Schema and labelling protocol: docs/DATASET.md. Validate with `wpbench validate`.
# A label ([case.truth]) without reviewed_by and reviewed_on is not used for any metric. No plugin source is stored here.
# Pilot cases chosen by the maintainer from dataset/candidates.md on 2026-11-01. Source is the NVD record of each CVE.
# after_cutoff assumes the experiment model is Sonnet 5.5 (training cutoff June 2026); revisit when the model is decided.

