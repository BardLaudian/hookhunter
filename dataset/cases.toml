[case.truth]
file = "includes/module-base.php"
function = "dienow"
line_start = 1305
line_end = 1311
entry_point = "public subscription action (newsletter 'ns'/subscription handler in subscription/subscription.php, hook_newsletter_action) with the 'nn' (name) request parameter; payload shown only when an administrator views the response"
data_flow = "$_REQUEST['nn'] -> build_subscription() -> subscription->data->name -> Newsletter antispam is_spam() returns WP_Error('spam-text', 'Spam text detected on name: ' . $full_name) (includes/antispam.php:35) -> subscription.php:238 dienow(..., $user->get_error_message(), 400) -> $admin_message appended unescaped when current_user_can('administrator') -> wp_die($message)"
notes = """
Sink: `$message .= $admin_message;` (line 1308) then `wp_die($message, $http_code);` (line 1310): no escaping.
Source of the reflected text: antispam.php:35 concatenates the unescaped name into the error message.
Fix 9.3.9: esc_html($message) and esc_html($admin_message), and wp_die() replaced by a minimal HTML page.
Draft: exploitation needs a logged-in administrator to follow the link (admin-only branch); reviewer to confirm data_flow entry details (action parameter names not traced).
"""
drafted_by = "claude"
reviewed_by = "BardLaudian"
reviewed_on = "2026-11-01"

