[case.truth]
file = "includes/MCP/Server.php"
function = "execute_tool"
line_start = 2177
line_end = 2185
entry_point = "MCP JSON-RPC tool call wp_update_user_meta via the REST routes bcs-mcp/v1/mcp (and /messages) registered in includes/API/REST_Controller.php with permission_callback __return_true; authentication is resolved inside the handler (not read in detail for this draft)"
data_flow = "tool arguments user_id, key, value -> execute_tool() case 'wp_update_user_meta' -> only gate is current_user_can('edit_user', $uid), which core grants for the caller's own ID -> key checked against a 3-item blocklist (user_pass, user_activation_key, session_tokens) -> non-string value passed through unsanitized -> update_user_meta($uid, 'wp_capabilities', array) = role change"
notes = """
Missing authorization / incomplete blocklist: `if ( ! current_user_can( 'edit_user', $uid ) ) throw ...` (line 2180), blocklist on 2182.
wp_delete_user_meta (case at line 2187) has the same pattern; wp_get_user_meta (line 2163) redacts only sensitive keys.
Fix 1.2.4: allow-list ALLOWED_USER_META_KEYS, requires promote_users, string-only values; also edit_user check in wp_assign_user_role (line ~3217).
Draft: wp_delete_user_meta / wp_assign_user_role are secondary locations, not separate labels.
"""
drafted_by = "claude"
reviewed_by = "BardLaudian"
reviewed_on = "2026-11-01"

