# Tool configuration only for now; the wpbench package metadata arrives in Phase 1.
[tool.pytest.ini_options]
testpaths = ["skills/wp-plugin-audit/tests"]
pythonpath = ["skills/wp-plugin-audit/scripts"]
addopts = "-q"
markers = ["network: fetches external URLs; enabled with WPBENCH_CHECK_URLS=1"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv", "skills/wp-plugin-audit/tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# The sink rule table and regexes are intentionally dense one-liners.
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
mypy_path = "skills/wp-plugin-audit/scripts"
explicit_package_bases = true
